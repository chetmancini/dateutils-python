name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dateutils-python
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.14.10"

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 scripts/validate_release_tag.py "$RELEASE_TAG"

      - name: Download the tested distribution packages from the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          gh release download "$RELEASE_TAG"
          --repo "$GITHUB_REPOSITORY"
          --dir dist
          --pattern '*.whl'
          --pattern '*.tar.gz'

      - name: Verify the downloaded distribution packages
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          version="${RELEASE_TAG#v}"
          ls -l dist
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          test -f "dist/dateutils_python-${version}-py3-none-any.whl"
          test -f "dist/dateutils_python-${version}.tar.gz"
          uv sync --locked --all-extras --dev
          uv run twine check dist/*
          make smoke-test-built-dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
